name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: for f in $(git ls-files 'server/*.js' 'scripts/*.js' 'public/js/*.js'); do node --check "$f"; done
