# Tilawat web version (docs/WEB.md): a static site; every video is rendered in the visitor's
# browser. `node web/build.js` needs no network, FFmpeg or npm install.

[build]
  command = "node web/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers for every response. Third-party hosts: QuranEnc (text), EveryAyah
# (recitation), the clip host (Pixabay CDN while the manifest is in "pixabay-direct" mode,
# Cloudflare R2 / a Worker later), Google Fonts (UI fonts + script fonts for translations).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.pixabay.com https://*.r2.dev https://*.workers.dev; media-src 'self' blob: https://everyayah.com https://cdn.pixabay.com https://*.r2.dev https://*.workers.dev; connect-src 'self' blob: data: https://quranenc.com https://everyayah.com https://cdn.pixabay.com https://*.r2.dev https://*.workers.dev https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/i18n/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
